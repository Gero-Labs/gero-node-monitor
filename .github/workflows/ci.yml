name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Syntax and smoke test
    # ubuntu-latest, not self-hosted: public-repo jobs never reach the private
    # runner pool, so a self-hosted label would leave every run queued forever.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Byte-compile every Python file
        run: python3 -m compileall -q .

      - name: Check shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          bash -n install.sh
          bash -n gero-node-monitor.sh
          bash -n scripts/smoke-test.sh
          bash -n scripts/update-pins.sh
          # Advisory for now: the existing scripts predate this check.
          shellcheck -S error install.sh gero-node-monitor.sh scripts/smoke-test.sh || true

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      # The installer pins a revision and the SHA-256 of each file it fetches.
      # If those drift the failure is silent and lands on operators, so verify
      # the pinned bytes still hash to what install.sh claims.
      - name: Verify installer pins
        run: ./scripts/verify-pins.sh
